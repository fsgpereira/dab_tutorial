# The main pipeline for dab_tutorial

resources:
  pipelines:
    dab_tutorial_etl:
      name: dab_tutorial_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dab_tutorial_etl"

      libraries:
        - glob:
            include: ../src/dab_tutorial_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
